<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime Investigator Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 20px;
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0052a3;
    }
    button:active {
      background: #004080;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.loading {
      display: block;
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    #cart-state {
      margin-top: 30px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      border-left: 4px solid #0066cc;
      font-family: monospace;
      font-size: 13px;
      white-space: pre;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checkout Form</h1>
    <p style="color: #666; margin-bottom: 30px;">
      This is a deterministic test page for Runtime Investigator.
      <br><strong>Select no currency to trigger a 422 error.</strong>
    </p>

    <div class="form-group">
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="">-- Select Currency --</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
      </select>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" value="test@example.com">
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="99.99">
    </div>

    <button id="checkout-btn">Checkout</button>

    <div id="status" class="status"></div>

    <div id="cart-state">
      <strong>Cart State:</strong>
      <span id="cart-data">Loading...</span>
    </div>
  </div>

  <script>
    // Simulate cart API
    async function getCart() {
      // Return cart with currency null to trigger the failure
      return new Promise(resolve => {
        setTimeout(() => {
          resolve({
            currency: null,
            items: [{ id: 1, price: 99.99 }],
            total: 99.99
          });
        }, 100);
      });
    }

    // Update cart display
    async function updateCartDisplay() {
      const cart = await getCart();
      document.getElementById('cart-data').textContent = JSON.stringify(cart, null, 2);
    }

    // Handle checkout
    document.getElementById('checkout-btn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      const currency = document.getElementById('currency').value;
      const email = document.getElementById('email').value;
      const amount = parseFloat(document.getElementById('amount').value);

      status.classList.remove('success', 'error');
      status.classList.add('loading');
      status.textContent = 'Processing checkout...';

      try {
        // Get current cart state (with null currency to trigger failure)
        const cart = await getCart();

        // Make POST request to /api/checkout
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            currency: currency || cart.currency,
            email,
            amount,
            timestamp: Date.now()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          // Expected failure: currency is required
          status.classList.remove('loading');
          status.classList.add('error');
          status.textContent = `Error ${response.status}: ${data.error || 'Checkout failed'}`;

          // Log error to console (for Runtime domain capture)
          console.error(`Checkout failed: ${data.error}`);
          return;
        }

        status.classList.remove('loading');
        status.classList.add('success');
        status.textContent = `Success! Order ID: ${data.orderId}`;
      } catch (error) {
        status.classList.remove('loading');
        status.classList.add('error');
        status.textContent = `Error: ${error.message}`;
        console.error('Checkout error:', error);
      }
    });

    // Initialize
    updateCartDisplay();
  </script>
</body>
</html>
